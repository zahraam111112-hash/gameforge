# Isolated stack for /mnt/data/gameforge. Its own bridge network, its own folder,
# and hard CPU/memory ceilings so a runaway agent round can never starve the host.
name: gameforge

services:
  site:
    build: .
    image: gameforge:local
    container_name: gameforge-site
    restart: unless-stopped
    command: ["node", "server/index.mjs"]
    environment:
      PORT: "8787"
      HOST: "0.0.0.0"
      NODE_OPTIONS: "--max-old-space-size=768"
    ports:
      - "127.0.0.1:9000:8787"
    volumes:
      - ./:/app
      - gameforge_node_modules:/app/node_modules
    networks: [gameforge_net]
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1024M, pids: 256 }
        reservations: { cpus: "0.25", memory: 256M }
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # http.get, not fetch: a fresh node process pays ~2-5s for fetch's bootstrap
      # (undici + DNS), which is longer than this timeout — the check then times
      # out against a server that is perfectly healthy.
      # The timeout is generous because the check starts a new node process, and
      # on a host shared with other projects that process can take 10s+ to boot
      # while the server answers in 3ms. The measured server itself answers fast;
      # what needs slack is the probe, not the service.
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8787/healthz',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s

  harness:
    image: gameforge:local
    depends_on: { site: { condition: service_healthy } }
    container_name: gameforge-harness
    restart: unless-stopped
    command: ["node", "harness/orchestrator.mjs"]
    environment:
      GAMEFORGE_API_KEY: ${GAMEFORGE_API_KEY:?GAMEFORGE_API_KEY is required}
      GAMEFORGE_MODEL: "deepseek-v4.1-flash"
      GAMEFORGE_LLM_ENDPOINT: "https://opencode.ai/zen/go/v1/chat/completions"
      GAMEFORGE_ROUND_SLEEP_MS: "60000"
      GAMEFORGE_SERVER: "http://site:8787"
      NODE_OPTIONS: "--max-old-space-size=1536"
      GIT_AUTHOR_NAME: "Navara Harness"
      GIT_AUTHOR_EMAIL: "harness@gameforge.local"
      GIT_COMMITTER_NAME: "Navara Harness"
      GIT_COMMITTER_EMAIL: "harness@gameforge.local"
    volumes:
      - ./:/app
      - gameforge_node_modules:/app/node_modules
      # The repo's core.sshCommand points at this exact path, so the key works
      # for `git push` from inside the container without touching ~/.ssh.
      - /mnt/data/gameforge/secrets:/mnt/data/gameforge/secrets:ro
    networks: [gameforge_net]
    deploy:
      resources:
        limits: { cpus: "2.00", memory: 2048M, pids: 512 }
        reservations: { cpus: "0.50", memory: 512M }
    security_opt: ["no-new-privileges:true"]

  # The bot fleet lives apart from the site: 200 WebSocket clients in the same
  # 1-CPU cgroup as the server they are testing measures the cgroup, not the
  # server. Run it with: docker compose run --rm load
  load:
    image: gameforge:local
    profiles: ["tools"]
    command: ["node", "harness/loadtest.mjs"]
    environment:
      GAMEFORGE_WS: ws://site:8787/ws
      GAMEFORGE_BOTS: "200"
    volumes:
      - ./:/app
      - gameforge_node_modules:/app/node_modules
    networks: [gameforge_net]
    deploy:
      # Each bot is a socket plus a timer, and the kernel accounts those toward
      # the pids limit. At 512 a 200-bot fleet hit the ceiling and the fleet
      # itself, not the server, was what timed out.
      resources:
        limits: { cpus: "2.00", memory: 1536M, pids: 2048 }
    security_opt: ["no-new-privileges:true"]

networks:
  gameforge_net:
    driver: bridge

volumes:
  gameforge_node_modules:
